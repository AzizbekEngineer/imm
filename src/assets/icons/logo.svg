<svg width="900" height="780" viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5FEFEF"/>
      <stop offset="100%" stop-color="#0FD8E0"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4F9C"/>
      <stop offset="100%" stop-color="#0B2E6B"/>
    </linearGradient>
    <linearGradient id="paleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF9FF"/>
      <stop offset="100%" stop-color="#BFEFF5"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2255C7"/>
      <stop offset="100%" stop-color="#173E8C"/>
    </linearGradient>
  </defs>

  <!-- ===== Triangle mark ===== -->
  <g filter="url(#softShadow)">
    <!-- Right blade (cyan) -->
    <polygon points="450,110 760,470 605,410 450,230" fill="url(#cyanGrad)" stroke="#0B2E6B" stroke-width="2" stroke-opacity="0.25"/>
    <!-- Bottom blade (navy) -->
    <polygon points="760,470 140,470 295,410 605,410" fill="url(#navyGrad)" stroke="#0B2E6B" stroke-width="2" stroke-opacity="0.25"/>
    <!-- Left/top blade (pale icy cyan) -->
    <polygon points="140,470 450,110 450,230 295,410" fill="#E4F9FC" stroke="#9FD9E6" stroke-width="2"/>
  </g>

  <!-- ===== Text: INTERIOR ===== -->
  <text x="450" y="600" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
        font-size="88" fill="url(#textGrad)" stroke="#12295E" stroke-width="2"
        letter-spacing="4">INTERIOR</text>

  <!-- ===== Text: MEGA MAX ===== -->
  <text x="450" y="690" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
        font-size="88" fill="url(#textGrad)" stroke="#12295E" stroke-width="2"
        letter-spacing="4">MEGA MAX</text>

  <!-- ===== Tagline ===== -->
  <text x="450" y="735" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="30" fill="#E23B2E">Bright future of your car</text>
</svg>
